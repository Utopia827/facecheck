name: FaceCheck
options:
  bundleIdPrefix: com.kobz
  deploymentTarget:
    iOS: "15.0"
targets:
  FaceCheck:
    type: application
    platform: iOS
    sources: [FaceCheck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobz.facecheck
        PRODUCT_NAME: FaceCheck
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FaceCheck
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera is used to take a short video selfie."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
